# CI : à chaque push et pull request. Tests Go (dont vcsim), formatage, construction des trois
# formats, contrôle de taille, démarrage sous QEMU et test de l'interface dans un navigateur headless.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Tests Go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vigie/go
          key: go-${{ hashFiles('go.sum', 'image/versions.mk') }}
      - run: scripts/version.sh
      - run: make fmt-check
      - run: make vet
      - run: make test

  images:
    name: Images, QEMU et interface
    needs: go
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/vigie/go
            ~/.cache/vigie/alpine
          key: img-${{ hashFiles('go.sum', 'image/versions.mk', 'image/overlay/etc/apk/world') }}
      - name: Outils QEMU et KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf sshpass xorriso >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          if [ -w /dev/kvm ]; then echo "QEMU_ACCEL=kvm:tcg" >> "$GITHUB_ENV"; fi
      - run: scripts/version.sh
      - name: OVA, ISO, qcow2 et contrôle de taille
        run: make release
      - name: Démarrage des formats sous QEMU
        run: make ci-qemu
      - name: Interface (Chromium headless)
        run: make ci-ui
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-${{ github.run_id }}
          path: |
            dist/ci-ui/
            dist/qemu-formats/*/serial.log
          retention-days: 14
          if-no-files-found: ignore
